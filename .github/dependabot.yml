# Controlled maintenance: alerts stay enabled; automatic pull requests are disabled.
# Monthly minor/patch groups are retained for maintainer-led maintenance; majors stay separate.
# Repository Dependabot security updates must also remain disabled.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
