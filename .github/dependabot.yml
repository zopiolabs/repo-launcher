# Keep routine updates grouped; review major upgrades separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
