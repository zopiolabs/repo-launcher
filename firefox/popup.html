<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Repo Launcher</title>
    <link rel="stylesheet" href="popup.css">
    <script src="github-counts.js" defer></script>
    <script src="badges.js" defer></script>
    <script src="popup.js" defer></script>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <main>
      <section aria-label="Saved repositories">
        <div class="toolbar">
          <input id="repo-search" type="search" aria-label="Search repositories" placeholder="Search repositories…" autocomplete="off" spellcheck="false" autofocus>
          <button id="toggle-add" type="button" title="Add repository" aria-label="Add repository" aria-controls="add-form" aria-expanded="false" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <span id="count" aria-label="Repository count" aria-live="polite" aria-atomic="true">0</span>
          <button id="refresh-counts" type="button" title="Refresh GitHub counts using your browser session" aria-label="Refresh GitHub counts">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-2l2 3M4 16l2 3a7 7 0 0 0 12-2" /></svg>
          </button>
      <button id="pin-button" type="button" title="Pin to side panel" aria-label="Pin to side panel" aria-pressed="false" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <g transform="rotate(35 12 12)">
            <path d="M9 3h6M10 3v6l-3 3v2h10v-2l-3-3V3M12 14v7" />
          </g>
          <path class="unpin-mark" d="M3 3l18 18" />
        </svg>
      </button>
        </div>
        <ul id="repositories"></ul>
        <p id="no-results" role="status" hidden>No repositories match your search.</p>
        <div id="empty-state"><strong>A home for your favorite repos.</strong><p>Use + to add your first repository.</p></div>
      </section>
      <form id="add-form" hidden>
        <label class="visually-hidden" for="repo-url">Repository URL</label>
        <input id="repo-url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://github.com/owner/repo" required maxlength="2048" aria-describedby="status" disabled>
        <button id="add-button" class="primary" type="submit" aria-label="Add repository" disabled><span aria-hidden="true">+</span> Add</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
